d /var/lib/aicc-agent 0700 root root -
d /var/lib/aicc-agent/claude 0700 root root -
d /var/lib/aicc-agent/codex 0700 root root -
d /run/aicc-agent-launcher 0750 root aicc-publisher -
d /run/aicc-agent-homes 0700 root root -
# 2750, not 2770: the agents' group must not be able to rename entries here
# (the launcher's rename-proof parent rule); agents reach only their own
# bound /workspace. The worker (owner) provisions workspaces beneath.
d /srv/aicc-workspaces 2750 aicc-worker aicc-workspace -
d /srv/aicc-quarantine 0700 root root -
