d /var/lib/aicc-agent 0700 root root -
d /var/lib/aicc-agent/claude 0700 root root -
d /var/lib/aicc-agent/codex 0700 root root -
d /run/aicc-agent-launcher 0750 root aicc-publisher -
d /run/aicc-agent-homes 0700 root root -
# The launcher stages per-run workspace binds here. The per-connection unit
# names it in ReadWritePaths=, and systemd sets the namespace up BEFORE the
# launcher runs, so a lazily created root made every first connection die
# with 226/NAMESPACE ("Connection reset by peer" on the worker side;
# worker-01 2026-09-08, ten launches in a row). It exists from boot.
d /run/aicc-agent-workspace-binds 0700 root root -
d /srv/aicc-workspaces 2770 aicc-worker aicc-workspace -
d /srv/aicc-quarantine 0700 root root -
