# Control-plane directories only.
#
# The agent tmpfiles (deploy/tmpfiles.d/aicc-agent.conf) create the
# installation-token store under /var/lib/aicc/github for the worker lanes.
# A control host never runs that file -- the control profile removes it --
# so without this entry the PR-window / review / merge ticks on control-01
# have nowhere readable to pick up the fleet App token and fall back to the
# ambient human credential (VOYN-W0-AICC-PR-WINDOW-TICK-BURNS-REST-QUOTA:
# identity=ambient reason=fleet_store_unreadable, ~400 REST calls/tick).
#
# Group is voynadmin: every repo-owned control tick runs as that principal
# (User=voynadmin on voyn-aicc-{review,merge,pr-window}.service). The minter
# writes the store 0640 root:voynadmin so those ticks can read it; the App
# private key stays root-only at /etc/voyn/secrets/aicc-github-app.pem.
d /var/lib/aicc/github 0750 root voynadmin -
d /var/lib/aicc/github/gh 0750 root voynadmin -
