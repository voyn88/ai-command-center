# Non-login execution identity.  aicc-worker remains the publisher/lease
# principal; the only group shared between them carries task workspace files.
u aicc-worker - "AICC guarded worker publisher" /var/lib/aicc-worker /usr/sbin/nologin
u aicc-agent - "AICC untrusted coding agent" /var/lib/aicc-agent /usr/sbin/nologin
g aicc-workspace -
g aicc-publisher -
# Ephemeral model-credential homes only; deliberately no static members.
g aicc-agent-auth -
m aicc-agent aicc-workspace
m aicc-worker aicc-workspace
m aicc-worker aicc-publisher
m voynadmin aicc-workspace
m voynadmin aicc-publisher
