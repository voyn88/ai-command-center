# Control-plane application identities. Neither is a member of
# aicc-workspace, aicc-publisher or aicc-agent-auth: neither ever touches a
# task workspace or a model credential -- that boundary belongs to
# aicc-agent.conf alone.
#
# aicc-app runs the backlog dispatch/queue-reap/review/merge ticks
# (aicc-backlog-planner/review/merge, aicc-queue-reaper) against PostgreSQL
# directly with /etc/aicc/app.env.
u aicc-app - "AICC control-plane application identity" - /usr/sbin/nologin
# aicc-rotator runs the drain-safe worker credential rotation
# (voyn-aicc-credential-rotation) from a worker host, over the pgtunnel to
# the control plane's PostgreSQL.
u aicc-rotator - "AICC drain-safe credential rotation identity" - /usr/sbin/nologin
