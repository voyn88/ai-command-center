# Control-plane identities.  A control host runs no coding agents, so the
# agent principal declared by aicc-agent.conf must never be created here --
# that file's installed target is worker-only (WORKER_ONLY_TARGETS in
# ops/aicc_install_transaction.py) and the installer applies it under the
# worker profile only.
#
# What the control file set does name is the publisher group:
# /etc/aicc/workspace-authority.env is installed 0640 root:aicc-publisher on
# every profile, so the group has to exist before the transaction prepares it.
# Deliberately no members: on a control host nothing but root reads that file
# yet, and the control units that will (planner, review, merge, reaper,
# rotation) arrive with VOYN-W0-AICC-CONTROL-PLANE-REPO-OWNED-UNITS, which is
# where their principal belongs.
g aicc-publisher -
