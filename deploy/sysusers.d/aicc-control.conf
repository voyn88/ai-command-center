# Control-plane identities only.
#
# deploy/sysusers.d/aicc-agent.conf provisions the agent layer: the
# `aicc-agent` execution principal, its ephemeral credential group and the
# workspace/publisher membership a worker host needs.  A control host must
# not carry that layer at all -- the installer's control profile removes the
# agent's files and never runs the agent sysusers/tmpfiles configs.
#
# `aicc-control-authority` owns /etc/aicc/workspace-authority.env on this
# profile, and owning it is what revokes it.  A worker-era process that is
# still running keeps the numeric aicc-publisher gid in its supplementary
# set until it exits -- taking it out of /etc/group changes nothing for that
# process -- so the file moves to a group created for this profile, whose gid
# no already-running process can be holding.  The group is declared with NO
# members on purpose: the authority key is root-only in practice until a
# dedicated control-plane publisher principal is created and given this
# membership deliberately.  Nothing is ever added back to aicc-publisher on
# a control host.
#
# `aicc-publisher` itself is still declared: the conversion takes the
# worker-era principals out of it, which needs the group to exist, and
# declaring it here means a control host that was never a worker resolves
# the same way one that was does.
g aicc-control-authority -
g aicc-publisher -
