# Control-plane identities only.
#
# deploy/sysusers.d/aicc-agent.conf provisions the agent layer: the
# `aicc-agent` execution principal, its ephemeral credential group and the
# workspace/publisher membership a worker host needs.  A control host must
# not carry that layer at all -- the installer's control profile removes the
# agent's files and never runs the agent sysusers/tmpfiles configs -- so the
# one identity the control profile still installs against is declared here on
# its own: /etc/aicc/workspace-authority.env is group-owned by aicc-publisher
# on every host.  No user is created: nothing on the control plane executes
# as an AICC principal, and an empty group keeps the authority file
# effectively root-only until a control-plane unit is given that membership
# deliberately.
g aicc-publisher -
