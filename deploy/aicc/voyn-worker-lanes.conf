# Worker lane registry for voyn-aicc-credential-rotation.service.
#
# Same lane set as deploy/aicc/worker-lanes (kept in sync by hand when a
# lane is added or removed), but shaped for
# command_center.ops.credential_rotation.load_lane_registry(), which
# requires full `voyn-aicc-worker@<N>.service` unit names
# (LANE_UNIT_PATTERN) so each entry can be handed straight to systemctl,
# rather than the bare numbers ops/aicc_staged_worker_rollout.py and
# ops/aicc_install_transaction.py expand from deploy/aicc/worker-lanes.
voyn-aicc-worker@1.service
voyn-aicc-worker@2.service
