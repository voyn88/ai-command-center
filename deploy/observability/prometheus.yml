global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/aicc-alerts.yml
scrape_configs:
  - job_name: aicc-control
    static_configs:
      - targets: ["control:8000"]
  # Operations replaces these entries with every enrolled worker metrics address.
  - job_name: aicc-worker
    static_configs:
      - targets: ["worker-01:9108"]
