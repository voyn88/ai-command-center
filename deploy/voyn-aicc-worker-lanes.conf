# Installed as /etc/voyn/aicc-worker-lanes.conf (root:root 0644) by
# ops/aicc_install_transaction.py, in the same generation as everything else
# on a worker host -- it was a hand-placed file until
# VOYN-W0-AICC-CONTROL-PLANE-REPO-OWNED-UNITS.
# One worker lane unit per line. This root-owned registry is the single
# authority for which lanes the credential rotator may operate on; the
# rotation helper and the rotator itself both read it. Adding a lane is an
# edit here plus enabling its voyn-aicc-worker@N.service — no sudoers change.
#
# This is deploy/aicc/worker-lanes written as unit names, and the two must
# name the same lanes: verify_lane_registry_agreement() refuses to build a
# generation while they disagree, so this file cannot quietly authorise a
# narrower fleet than the one the installer deploys lanes for.
voyn-aicc-worker@1.service
voyn-aicc-worker@2.service
