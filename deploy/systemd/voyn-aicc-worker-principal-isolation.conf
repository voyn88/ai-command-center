# Drop-in for the /etc/systemd/system copy of voyn-aicc-worker@.service only.
# Its own destination -- /etc/systemd/system/voyn-aicc-worker@.service.d/ and
# /etc/systemd/system/aicc-worker.service.d/, never a user unit's drop-in
# directory -- is what makes the mount/network directives below a real
# boundary: a user unit shares its own account's UID, and that account can
# edit, reload, or bypass its own drop-ins at will, so the same directives
# would then only ever be restricting a process it already fully controls
# by other means (see deploy/systemd/aicc-worker.service's header). Both
# installer destinations are pinned by
# tests/ops/test_worker_unit_is_a_system_unit.py.

[Unit]
Requires=aicc-principal-recovery.service
After=aicc-principal-recovery.service

[Service]
SupplementaryGroups=aicc-workspace aicc-publisher
Environment=AICC_AGENT_PRINCIPAL_ISOLATION=required
EnvironmentFile=/etc/aicc/workspace-authority.env
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=true
# The preprod clone source lives under /home/voynadmin; ProtectHome
# presents an empty /home, so the ONE directory the worker must read
# is bind-mounted back read-only -- secrets in the rest of the home
# stay invisible (review finding on 63cb072).
BindReadOnlyPaths=/home/voynadmin/Projects/ai-command-center
PrivateTmp=true
PrivateDevices=true
ProtectProc=invisible
ProcSubset=pid
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
LockPersonality=true
KeyringMode=private
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
UMask=0077
ReadWritePaths=/srv/aicc-workspaces
