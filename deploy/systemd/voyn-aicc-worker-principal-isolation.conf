[Unit]
Requires=aicc-principal-recovery.service
After=aicc-principal-recovery.service

[Service]
SupplementaryGroups=aicc-workspace aicc-publisher
Environment=AICC_AGENT_PRINCIPAL_ISOLATION=required
EnvironmentFile=/etc/aicc/workspace-authority.env
NoNewPrivileges=true
ProtectSystem=strict
# tmpfs, not true: `true` mounts an inaccessible, EMPTY /home, and a
# BindReadOnlyPaths= below it never becomes visible (the lane saw "No such
# file" for the clone on worker-01, 2026-09-08). `tmpfs` gives the lane an
# empty /home it can traverse, so exactly the directories bound back below
# exist for it -- the rest of the home stays invisible (systemd.exec(5),
# ProtectHome=). read-only would expose every home the DAC bits allow.
ProtectHome=tmpfs
# The clone sources the projects' repository_path point at (project
# config); bound back read-only, the agent works in /srv/aicc-workspaces.
# The missing-tolerant `-` on aios: a host without that clone still
# serves ai-command-center tasks (review finding on 63cb072 for the shape).
BindReadOnlyPaths=/home/voynadmin/Projects/ai-command-center
BindReadOnlyPaths=-/home/voynadmin/Projects/aios
# The bound clones are owned by voynadmin and read by aicc-worker: git
# refuses them as "dubious ownership" (worker-01 2026-09-08: every writer
# lease acquire died at `git rev-parse --show-toplevel`). Trust exactly the
# bound paths -- never `*` -- through the environment, so the immutable
# release and the lane's own home carry no gitconfig to drift.
Environment=GIT_CONFIG_COUNT=2
Environment=GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0=/home/voynadmin/Projects/ai-command-center
Environment=GIT_CONFIG_KEY_1=safe.directory GIT_CONFIG_VALUE_1=/home/voynadmin/Projects/aios
PrivateTmp=true
PrivateDevices=true
ProtectProc=invisible
ProcSubset=pid
ProtectControlGroups=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectClock=true
ProtectHostname=true
RestrictSUIDSGID=true
LockPersonality=true
KeyringMode=private
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
UMask=0077
ReadWritePaths=/srv/aicc-workspaces
