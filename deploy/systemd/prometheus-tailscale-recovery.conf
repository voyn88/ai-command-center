# Drop-in for the DISTRO's prometheus.service. The vendor unit is left exactly
# as the package ships it (and keeps whatever the package changes next); this
# file only adds what the control host's listener needs.
#
# Prometheus here binds the control host's Tailscale address
# (--web.listen-address 100.114.209.119:9090) because the fleet reaches it
# across the tailnet and the alternative -- a wildcard bind -- would publish
# it. That address does not exist until tailscaled has brought the interface
# up, and a Prometheus that cannot bind its listener exits 1: an ORDINARY
# failure, which the vendor unit's Restart=on-abnormal does not retry. So the
# service lost its single start at boot and stayed down with nothing on the
# host trying again, and every monitor tick on control-01 measured
# `prometheus_unready` (monitor_finding #41637,
# VOYN-MON-CONTROL-01-QUEUE-PROMETHEUS-UNREADY). The repo's answer to that
# race -- voyn-prometheus-recovery.timer -- was a file in deploy/systemd that
# nothing installed and nothing enabled, which is "someone could type it",
# not "it is deployed". Both are now part of the control generation.
#
# Ordering first, so the ordinary boot does not race at all.
[Unit]
After=network-online.target tailscaled.service
Wants=network-online.target tailscaled.service
# Then a restart budget for the window ordering cannot cover: an address that
# appears seconds after tailscaled starts, or that disappears and returns on a
# re-key or a tailscaled restart. Bounded on purpose -- ten tries over five
# minutes recover a listener that is merely late, and then it stops, so a
# Prometheus that can NEVER bind stays a dead unit the monitors report
# (`prometheus_unready` here, `failed_units` on the host probe) instead of the
# every-few-seconds forever loop that hid ollama.service for twelve days while
# every probe stayed green (see UnitHealthSnapshot in
# command_center/ops/infra_monitor.py). The unbounded-but-slow outer retry is
# voyn-prometheus-recovery.timer, which rearms a minute after this unit goes
# inactive for any reason, including a spent start-limit budget.
StartLimitIntervalSec=5min
StartLimitBurst=10

[Service]
Restart=always
RestartSec=15s
