services:
  aml:
    build:
      context: .
      dockerfile: Dockerfile
    image: aml-service:latest
    container_name: aml-service
    restart: unless-stopped
    ports:
      # The host interface is a fixed loopback literal, not an operator
      # variable. This service has no authentication and performs privileged
      # git/gh and subprocess operations; an unqualified "8501:8501" (or any
      # widened host) publishes on EVERY host interface, and Docker writes
      # that rule below a host firewall, so the exposure would not show up in
      # the firewall's own configuration. There used to be an AML_BIND_HOST
      # variable to widen this "behind a reviewed authenticating proxy" — four
      # attempts to build that proxy were rejected on review (see ADR-0011,
      # docs/adr/0011-streamlit-console-no-remote-reachability.md) because
      # Streamlit's WebSocket transport cannot be safely gated at connection
      # admission. Remote access is an SSH tunnel or a private network segment
      # onto this loopback port, never a published port, matching the
      # Postgres precedent in docker-compose.server.yml.
      - "127.0.0.1:${AML_PORT:-8501}:8501"
    volumes:
      - aml-data:/data
    environment:
      AICC_DATA_DIR: /data
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      # Опционально: переопределить порт внутри контейнера
      STREAMLIT_SERVER_PORT: "8501"
      # Адрес прослушивания ВНУТРИ сетевого namespace контейнера. Здесь 0.0.0.0
      # корректен и обязателен: namespace приватный, а опубликованный выше порт
      # не смог бы достучаться до сервиса, слушающего только 127.0.0.1 внутри
      # контейнера. Реальная граница экспозиции — адрес публикации в `ports`.
      # Entrypoint не имеет значения по умолчанию и без этой строки не стартует.
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      com.aml.description: "AML Monitoring & Compliance Service (115-ФЗ)"
      com.aml.version: "1.0"

volumes:
  aml-data:
    driver: local
