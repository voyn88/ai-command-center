services:
  aml:
    build:
      context: .
      dockerfile: Dockerfile
    image: aml-service:latest
    container_name: aml-service
    restart: unless-stopped
    ports:
      # The host interface is named explicitly and defaults to loopback. An
      # unqualified "8501:8501" publishes on EVERY host interface, and Docker
      # writes that rule below a host firewall, so the exposure would not show
      # up in the firewall's own configuration. This service has no
      # authentication and performs privileged git/gh and subprocess
      # operations, so reaching it off-host must be a deliberate act.
      #
      # docs/adr/0011-streamlit-console-no-remote-reachability.md records that
      # no authenticating proxy is planned for this console — four attempts to
      # build one were rejected by review, each for a distinct credential- or
      # session-handling hazard. AML_BIND_HOST still exists for an operator's
      # own already-trusted network topology (e.g. a private management
      # segment), entirely at that operator's own risk and with no
      # AICC-provided authentication in front of it. Remote, authenticated
      # access instead goes through command_center.webapi (the web client), or
      # an SSH port-forward onto this loopback publication for the console
      # itself.
      - "${AML_BIND_HOST:-127.0.0.1}:${AML_PORT:-8501}:8501"
    volumes:
      - aml-data:/data
    environment:
      AICC_DATA_DIR: /data
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      # Опционально: переопределить порт внутри контейнера
      STREAMLIT_SERVER_PORT: "8501"
      # Адрес прослушивания ВНУТРИ сетевого namespace контейнера. Здесь 0.0.0.0
      # корректен и обязателен: namespace приватный, а опубликованный выше порт
      # не смог бы достучаться до сервиса, слушающего только 127.0.0.1 внутри
      # контейнера. Реальная граница экспозиции — адрес публикации в `ports`.
      # Entrypoint не имеет значения по умолчанию и без этой строки не стартует.
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      com.aml.description: "AML Monitoring & Compliance Service (115-ФЗ)"
      com.aml.version: "1.0"

volumes:
  aml-data:
    driver: local
