name: Acceptance gate

# Makes independent acceptance a merge condition instead of a procedure.
#
# The delivery rules require a reviewer who is not the author to accept the
# exact commit that merges. GitHub cannot express that here: the acceptance
# identity is an app with `contents: read`, and GitHub counts approvals only
# from accounts with write access, while every agent shares the account that
# opens the pull request, so self-approval is refused at the API. The verdict
# is therefore published as a review opening with
# `ACCEPTANCE: ACCEPT <head sha>`, and this workflow is what makes it binding.
# Independence is provable here — the app reviews under its own `login` — even
# though it is invisible to branch protection.
#
# `pull_request_review` is not optional. A verdict normally arrives *after* CI,
# and a gate subscribed to `pull_request` alone would have run once, found no
# verdict, failed, and stayed red for a commit that has since been accepted,
# with no event left to re-evaluate it. The review event re-runs the gate on
# the unchanged head, and the sha check keeps that from being a loophole: the
# re-run still only passes on a verdict naming the current head.
#
# A separate file rather than a job in `ci.yml`: this gate reaches the API on
# every review event, and the open pull requests rebase against `ci.yml`.
#
# Merge queue checks run on a synthetic commit, not on a pull request head.
# `merge_group` is therefore mandatory: the verifier resolves every pull
# request represented by the synthetic commit range and requires a live,
# independent exact-head verdict for each one. Ambiguous group history refuses
# rather than silently accepting only the last pull request in a batch.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]

concurrency:
  # Per pull request or exact synthetic merge-group head, so a burst of review
  # events collapses while independent queue groups never cancel one another.
  # A cancelled run reports as a failure, which is the safe side.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

# Read-only, and only what the one API caller needs: the pull request's head
# sha, its author, and its reviews. This gate has nothing to write.
permissions:
  contents: read
  pull-requests: read

jobs:
  acceptance-gate:
    name: Acceptance gate (independent verdict on exact SHA)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-acceptance')
        shell: bash
        run: exit 1

      # Declared rather than inherited, for the reason `ci.yml`'s secret-bearing
      # steps declare it: an inherited shell depends on `runs-on`, so moving the
      # job to another runner would change whether a non-zero exit ends the
      # step without anyone touching the step. Stdlib only, so the runner's
      # pre-installed Python needs no setup step.
      - name: Require an independent verdict on the current head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: python3 scripts/assert_independent_acceptance.py
