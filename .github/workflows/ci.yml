name: CI

# Automated quality gates for AI Command Center.
#
# Runs the deterministic local validation commands (whitespace errors, Ruff,
# byte-compile, full pytest with coverage) in a clean, ephemeral environment on
# every pull request into main and on every push to main, plus on-demand via the
# Actions tab.
#
# Design constraints (see README "Continuous integration"):
#   * No secrets are referenced; the suite mocks every real Claude/Codex CLI call
#     and never spends API credits or launches a real agent job.
#   * Least-privilege token: read-only, no GitHub write operations.
#   * The test suite isolates itself from real data via AICC_DATA_DIR / a
#     monkeypatched REPORTS_ROOT (tests/conftest.py); the runner is disposable, so
#     nothing is mutated outside per-test temp fixtures.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue tests the *prospective* merged result — this branch's
  # commits on top of whatever else the queue is about to land — rather than
  # the branch in isolation. Without this trigger the queue's checks never
  # start and every entry times out, so the trigger has to exist before the
  # queue is switched on, not with it.
  #
  # This is a base-repository event, so secrets ARE available here, while the
  # `pull_request` path withholds them from forks. Since the queue ref carries
  # the pull request's own commits, the queue would otherwise make repository
  # secrets reachable from fork-authored code. Every step that receives a
  # repository secret therefore begins by asserting that the code it is about
  # to run was authored here — see `scripts/assert_trusted_head_repository.py`,
  # pinned for all steps by `tests/test_release_gate_policy.py`
  # (`VOYN-W0-AICC-MERGE-QUEUE-FORK-POLICY`).
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same ref (e.g. a new push to an open PR) so only
# the latest commit's gates keep running.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gates only read the checked-out code.
# `pull-requests: read` is the one addition beyond that, and it exists for a
# single caller: `scripts/assert_trusted_head_repository.py` resolves the queued
# pull request to learn which repository authored the code, because the
# `merge_group` payload does not say. Read-only, and narrower than the secret it
# protects.
permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  quality-gates:
    name: Quality gates (whitespace · Ruff · compile · pytest)
    runs-on: ubuntu-latest
    # A single coverage-enabled pass can take more than 18 minutes on a cold
    # runner; keep headroom for runner variance while bounding genuine hangs.
    timeout-minutes: 30
    env:
      AICC_AIOS_SDK_WHEEL: ${{ github.workspace }}/.artifacts/aios_sdk-0.2.0-py3-none-any.whl
      # The second accepted AIOS distribution: universal PostgreSQL primitives
      # (VOYN-W0-AIOS-DB-01). Pinned and verified exactly like the SDK wheel.
      AICC_AIOS_DB_WHEEL: ${{ github.workspace }}/.artifacts/aios_db-0.1.0-py3-none-any.whl
      # PostgreSQL foundation tests (tests/db, VOYN-W0-AICC-SRV-01a). They skip
      # themselves when this is unset, so a laptop without Docker still runs a
      # green `pytest -q`; here the service below makes them execute for real.
      AICC_TEST_PG_ADMIN_DSN: >-
        host=127.0.0.1 port=5432 dbname=postgres user=postgres
        password=ci-only-throwaway-Kq7vRt2wXz
    services:
      # Same image and digest as docker-compose.server.yml: the migration,
      # privilege and restore behaviour under test is version-dependent, so CI
      # must exercise the version production runs.
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_PASSWORD: ci-only-throwaway-Kq7vRt2wXz
          POSTGRES_DB: postgres
        # Plain host:container mapping — the Actions runner is an ephemeral,
        # network-isolated VM, and its `ports` syntax does not take a host IP.
        # The loopback-only binding that matters is in
        # docker-compose.server.yml, which is what a real install runs.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect docs-only change scope
        id: change-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA...HEAD")"
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -Eqv '(^README\.md$|^CHANGELOG\.md$|^docs/|\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-linux')
        run: exit 1

      - name: Set up Python
        if: steps.change-scope.outputs.docs_only != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci-linux.lock

      # System libraries the optional PySide6 desktop shell (requirements-
      # desktop.txt) links against at import time. The ubuntu-latest image does
      # not ship libEGL, so without this `pytest-qt`'s `pytest_configure` hook
      # crashes the whole suite with `ImportError: libEGL.so.1` before any test
      # (even non-desktop ones) can run. Cheap (apt), only needed when the
      # desktop deps are installed.
      - name: Install Qt system libraries (for optional desktop shell)
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # `tests/db`'s backup/restore drill runs the real scripts, which need a
      # client at least as new as the server. The runner image ships an older
      # postgresql-client, and pg_dump refuses to dump a newer server outright,
      # so the matching major is installed from PGDG.
      - name: Install PostgreSQL 17 client (for the backup/restore drill)
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Install dependencies
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-ci-linux.lock

      - name: Install exact accepted AIOS SDK and DB artifacts
        if: steps.change-scope.outputs.docs_only != 'true'
        # `bash` is not cosmetic here and is pinned by
        # `test_a_refused_guard_actually_stops_the_step`: GitHub runs it as
        # `bash --noprofile --norc -eo pipefail`, so the guard's non-zero exit
        # aborts the step. Under `pwsh` it would not — a failed native command
        # is not a terminating error there, and the fetch below would run with
        # the token anyway.
        shell: bash
        env:
          AIOS_ARTIFACT_READONLY_TOKEN: ${{ secrets.AIOS_ARTIFACT_READONLY_TOKEN }}
          AIOS_ARTIFACT_READ_TOKEN: ${{ secrets.AIOS_ARTIFACT_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/assert_trusted_head_repository.py
          python scripts/fetch_aios_sdk_artifact.py --output .artifacts
          pip install "$AICC_AIOS_SDK_WHEEL"
          python scripts/fetch_aios_sdk_artifact.py --lock aios-db.lock.json --output .artifacts
          pip install "$AICC_AIOS_DB_WHEEL"

      # Narrows the REQUIRED pytest steps below to the impact-selected subset
      # on pull_request only -- merge_group/push/workflow_dispatch always run
      # the unabridged suite regardless of this step's output, unconditionally
      # (the actual safety net: the exact set that lands on main is always
      # fully verified there, whatever ran narrower on the PR that got it
      # there). `scripts/ci/test_impact/select_tests.py` already backs the
      # advisory `impact-fast-check` job below; this reuses the identical
      # selector, not a second implementation, so the two can never disagree.
      #
      # Fail-open by construction, never fail-narrow: any outcome other than
      # a clean `mode=subset` -- the selector erroring, a global/ambiguous
      # file (conftest, lockfile, pyproject, CI config, or anything the
      # selector cannot map) reporting `ALL`, or genuinely no first-party
      # file changed -- runs the full suite. "Ambiguity widens the
      # selection, never narrows it" (the selector's own module docstring)
      # is the same rule this step defers to, not a second policy.
      - name: Select impacted tests (pull_request only)
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python scripts/ci/test_impact/select_tests.py \
              --base "$BASE_SHA" --format pytest --output selected-tests.txt; then
            echo "::warning::test-impact selector failed; running the full suite"
            echo "mode=all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qx "tests" selected-tests.txt; then
            mode=all   # trigger-all: a global/unmapped file changed
          elif [ -s selected-tests.txt ]; then
            mode=subset
          else
            mode=all   # no first-party file changed -- widen, never skip
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "----- test-impact selection: mode=$mode -----"
          cat selected-tests.txt || true

      - name: Whitespace errors
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...HEAD"
          else
            git show --check --format= HEAD
          fi

      - name: Ruff
        if: steps.change-scope.outputs.docs_only != 'true'
        run: ruff check .

      - name: Compile validation
        if: steps.change-scope.outputs.docs_only != 'true'
        run: python -m compileall -q command_center scripts tests app.py

      # Required test gate, parallelised with pytest-xdist. `-n auto` fans the
      # ~3k-test suite across every runner core (the suite isolates each worker
      # via per-process temp data dirs in tests/conftest.py); `--dist loadscope`
      # keeps all tests from one module on the same worker so module-scoped
      # fixtures are built once, not per worker. This is the change that brings
      # the gate from ~18 min down under 8 min.
      #
      # `-m "not serial"` excludes the handful of tests that must not run
      # concurrently; those run in the "Pytest (serial tail)" step below, so the
      # set of tests that run is unchanged — coverage is not reduced.
      #
      # Coverage is collected here (pytest-cov combines the xdist workers'
      # data automatically). No fail-under threshold is configured, so test
      # failures still gate the job while coverage stays informational.
      # Durations keep future runtime regressions visible in the CI log.
      # Coverage measurement is the single largest wall-time multiplier of
      # this job (VOYN-W0-AICC-CI-FAST-01). On pull requests it decides
      # nothing — failures gate, coverage informs — so PRs run bare and the
      # full instrumented pass stays on main pushes and merge queues, where
      # the number is actually consumed. The SET of tests is identical.
      - name: Pytest + coverage (parallel)
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COV_ARGS=""
          else
            COV_ARGS="--cov=command_center --cov-report=term --cov-report=xml"
          fi
          # See the serial-tail step below for why this is not piped through
          # `xargs`: it converts pytest's own exit codes into its 123, which
          # hides the "no tests collected" 5 that a narrow subset can
          # legitimately produce. Tolerated ONLY in subset mode -- in a full
          # run, collecting nothing means collection itself is broken and
          # must fail.
          set +e
          if [ "${{ steps.select.outputs.mode }}" = "subset" ]; then
            echo "Impact-selected subset ($(wc -l < selected-tests.txt) file(s)):"
            cat selected-tests.txt
            set --
            while IFS= read -r selected_test; do
              [ -n "$selected_test" ] && set -- "$@" "$selected_test"
            done < selected-tests.txt
            pytest -q -m "not serial" -n auto --dist loadscope \
              --durations=50 $COV_ARGS "$@"
            rc=$?
            if [ "$rc" -eq 5 ]; then
              echo "Subset contains only serial-marked tests; the tail step runs them."
              exit 0
            fi
            exit $rc
          fi
          pytest -q -m "not serial" -n auto --dist loadscope \
            --durations=50 \
            $COV_ARGS
          exit $?

      # Small non-parallel tail: the `serial`-marked tests that rely on
      # process-global or cross-process shared state. Runs in a single worker
      # and appends to the coverage data from the parallel step. Tolerates
      # pytest's exit code 5 ("no tests collected") so the step stays green
      # while the serial set is empty.
      - name: Pytest (serial tail)
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COV_ARGS=""
          else
            COV_ARGS="--cov=command_center --cov-append --cov-report=term"
          fi
          # NOT piped through `xargs` (VOYN-W0-AICC-CI-SERIAL-TAIL-EXIT-5):
          # this step's whole contract is that pytest's exit code 5 ("no
          # tests collected") is a PASS -- an impact-selected subset very
          # often contains no `serial`-marked test at all. `xargs` reports
          # its own 123 for "the command exited non-zero", swallowing the 5
          # before the check below could see it, so every such PR failed the
          # required gate. Introduced by the impact-selection change (#363)
          # and caught by the very next PR (#365).
          #
          # Reading the file into "$@" keeps each path a separate argv
          # element without a shell-word-splitting hazard, and the `set --`
          # form means an empty file yields no arguments at all, which the
          # `mode == subset` guard already makes unreachable.
          if [ "${{ steps.select.outputs.mode }}" = "subset" ]; then
            set --
            while IFS= read -r selected_test; do
              [ -n "$selected_test" ] && set -- "$@" "$selected_test"
            done < selected-tests.txt
            pytest -q -m serial -p no:xdist $COV_ARGS "$@"
          else
            pytest -q -m serial -p no:xdist $COV_ARGS
          fi
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No serial-marked tests collected; nothing to run."
            exit 0
          fi
          exit $rc

      # Informational, non-blocking signal. It never fails the job so the merge
      # gate stays focused on the deterministic checks above while surfacing
      # type-check progress for a codebase that is not yet fully typed.

      - name: Type check (informational)
        if: steps.change-scope.outputs.docs_only != 'true'
        continue-on-error: true
        run: mypy command_center || true

      # Cache the Playwright Chromium download (~150 MB) so the E2E step below
      # does not re-download the browser on every run. Keyed on the pinned
      # playwright version in the lock so a driver bump invalidates the cache.
      - name: Cache Playwright browsers
        if: steps.change-scope.outputs.docs_only != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-ci-linux.lock') }}

      # Real-browser lifecycle projection is a release invariant, not an
      # informational signal: a failing user journey must fail this check.
      - name: Real-browser E2E
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python -m playwright install chromium
          pytest -q tests/test_e2e_status_projection.py

  # Windows 11 x64 leg of the D1 desktop acceptance gate. Mirrors `quality-gates`
  # but on `windows-latest`, so the `pytest-qt` desktop suite and full repository
  # suite run on the platform contract's first Windows target (`PLATFORM_BEHAVIOR.md`
  # §2). This covers the *automated* half of `AICC-D1-GATE`; the interactive
  # display checklist (exact-width geometry round-trip, visible palette switch)
  # still needs a human on a real Windows 11 x64 machine with a display — see
  # `docs/desktop/WINDOWS_RUNBOOK.md` Part B. Per that runbook and the gate
  # definition, a green run here does NOT by itself close the interactive gate.
  # The automated Windows context is nevertheless release-relevant: after this
  # workflow has appeared green on an exact PR head, branch protection can bind
  # its stable job name without relying on an agent report.
  windows-quality-gates:
    name: Windows quality gates (Ruff · compile · pytest)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # PySide6 headless platform plugin; `tests/desktop/conftest.py` already
      # `setdefault`s this, but set it explicitly so a non-empty value is
      # guaranteed (an empty value would crash Qt, per WINDOWS_RUNBOOK.md §2).
      QT_QPA_PLATFORM: "offscreen"
      AICC_AIOS_SDK_WHEEL: ${{ github.workspace }}/.artifacts/aios_sdk-0.2.0-py3-none-any.whl
      # The second accepted AIOS distribution: universal PostgreSQL primitives
      # (VOYN-W0-AIOS-DB-01). Pinned and verified exactly like the SDK wheel.
      AICC_AIOS_DB_WHEEL: ${{ github.workspace }}/.artifacts/aios_db-0.1.0-py3-none-any.whl
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Detect docs-only change scope
        id: change-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_FILES="$(git diff --name-only "$BASE_SHA...HEAD")"
          if [[ -z "$CHANGED_FILES" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGED_FILES" | grep -Eqv '(^README\.md$|^CHANGELOG\.md$|^docs/|\.md$)'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-windows')
        run: exit 1

      - name: Set up Python
        if: steps.change-scope.outputs.docs_only != 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci-windows.lock

      - name: Install dependencies
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-ci-windows.lock

      - name: Install exact accepted AIOS SDK and DB artifacts
        if: steps.change-scope.outputs.docs_only != 'true'
        # This step is why the invariant checks the shell and not just the
        # order of the lines. It had no `shell:`, so on `windows-latest` it ran
        # under `pwsh`, where a native command's non-zero exit is not a
        # terminating error and `$ErrorActionPreference = 'stop'` does not
        # cover it. The guard refused and the very next line fetched the
        # artifact with both tokens in its environment, and the step still
        # exited 0. `bash` on the Windows runner is `-eo pipefail`, so the
        # refusal now ends the step; the env references are plain `$VAR`
        # accordingly.
        shell: bash
        env:
          AIOS_ARTIFACT_READONLY_TOKEN: ${{ secrets.AIOS_ARTIFACT_READONLY_TOKEN }}
          AIOS_ARTIFACT_READ_TOKEN: ${{ secrets.AIOS_ARTIFACT_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/assert_trusted_head_repository.py
          python scripts/fetch_aios_sdk_artifact.py --output .artifacts
          pip install "$AICC_AIOS_SDK_WHEEL"
          python scripts/fetch_aios_sdk_artifact.py --lock aios-db.lock.json --output .artifacts
          pip install "$AICC_AIOS_DB_WHEEL"

      - name: Ruff
        if: steps.change-scope.outputs.docs_only != 'true'
        run: ruff check .

      - name: Compile validation
        if: steps.change-scope.outputs.docs_only != 'true'
        run: python -m compileall -q command_center scripts tests app.py

      # The desktop pytest-qt suite is the deterministic Windows-relevant signal
      # for the D1 desktop gate. Kept informational for the merge gate (not
      # required) but mirrors the ubuntu job's coverage so Windows regressions
      # surface early. This is exactly the automated half WINDOWS_RUNBOOK.md
      # Step 2 calls for (ruff · compile · `pytest tests/desktop`).
      - name: Desktop pytest-qt suite
        if: steps.change-scope.outputs.docs_only != 'true'
        run: pytest tests/desktop -q

      # Real-browser E2E of the status projection. The full repository `pytest -q` is deliberately
      # NOT run here: ~200 of its non-desktop tests are POSIX-only by design
      # (process-group supervision via waitid(WNOWAIT)) and others hit the
      # Windows console `charmap` codec, so a Windows full-suite run is pure
      # noise plus ~23 min of runtime that risks cancelling the job. The
      # desktop gate signal is the `tests/desktop` suite above.
      - name: Real-browser E2E
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python -m playwright install chromium
          pytest -q tests/test_e2e_status_projection.py

  # A deterministic security regression context. Dependency-vulnerability
  # feed signals are collected through pinned local lock checks and fixed tools.
  # This gate verifies the workflow policy itself plus the
  # product's fail-closed provenance and report-path containment boundaries.
  security-gates:
    name: Security gates (workflow policy · provenance · supply chain)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-security')
        run: exit 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-security.lock

      - name: Install exact runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-security.lock

      - name: Build Python dependency SBOM
        run: python -m pip inspect --local > security-sbom.json

      - name: Critical/high vulnerability scan (pip-audit)
        run: |
          python -m pip install pip-audit==2.9.0 detect-secrets==1.5.0
          pip-audit -r requirements-ci-linux.lock --format json --output dependency-vulns.json || true
          python - <<'PY'
          import json

          data = json.load(open("dependency-vulns.json", "r", encoding="utf-8"))
          vulns = data.get("results", data.get("vulnerabilities", []))
          bad = []
          for row in vulns:
              vulnerability = row.get("vulnerability", {})
              sev = str(vulnerability.get("severity", "")).lower()
              pkg = row.get("package", {})
              name = pkg.get("name") if isinstance(pkg, dict) else row.get("package", "?")
              vid = vulnerability.get("id", "unknown")
              if sev in {"high", "critical"}:
                  bad.append(f"{name}: {vid} ({sev})")

          if bad:
              raise SystemExit("critical/high vulnerabilities found: " + ", ".join(bad))
          PY

      - name: Secret scan
        run: |
          python -m pip install detect-secrets==1.5.0
          cp .secrets.baseline /tmp/secrets-baseline-before.json
          detect-secrets scan --baseline .secrets.baseline
          python - <<'PY'
          import collections
          import json

          def inventory(path):
              data = json.load(open(path, "r", encoding="utf-8"))
              return collections.Counter(
                  (filename, finding["type"], finding["hashed_secret"])
                  for filename, findings in data.get("results", {}).items()
                  for finding in findings
              )

          before = inventory("/tmp/secrets-baseline-before.json")
          after = inventory(".secrets.baseline")
          added = sum((after - before).values())
          if added:
              raise SystemExit(
                  f"secret baseline changed: {added} added"
              )
          PY

      - name: Initialize CodeQL
        uses: github/codeql-action/init@c4dd10e44af883a891fe31ced449bcb4a6728b9b
        with:
          languages: python

      - name: Autobuild for CodeQL
        uses: github/codeql-action/autobuild@c4dd10e44af883a891fe31ced449bcb4a6728b9b

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@c4dd10e44af883a891fe31ced449bcb4a6728b9b

      - name: Release gate policy
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: pytest -q tests/test_release_gate_policy.py

      - name: Focused security regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          pytest -q \
            tests/test_provenance_gating.py \
            tests/test_report_path_containment.py \
            tests/test_runtime_report_path_containment.py \
            tests/test_codex_safety_boundaries.py

  # Build a real production artefact instead of treating Python byte-compilation
  # as a product build. `npm ci` is locked by web/package-lock.json and the Vite
  # command includes the TypeScript project build before emitting web/dist/.
  build-gates:
    name: Build gates (web production)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Deliberate failure canary
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-gate-canary-build')
        run: exit 1

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web dependencies
        run: npm ci --prefix web

      - name: Web production build
        run: npm run build --prefix web

  # ADVISORY fast pre-check. On a pull request it uses the dependency-based
  # test-impact selector (scripts/ci/test_impact/) to run ONLY the tests that
  # could be affected by the changed files, in parallel, for a quick signal.
  #
  # This job is deliberately NOT listed in `final-gate.needs`, so it can never
  # be the sole gate: the full `quality-gates` suite above remains the required
  # merge gate and no coverage is lost if the selector under-selects. When a
  # global file (conftest, pyproject, a lock) changes the selector reports
  # "ALL" and this job simply defers to the full gate instead of re-running it.
  impact-fast-check:
    name: Impact fast pre-check (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AICC_AIOS_SDK_WHEEL: ${{ github.workspace }}/.artifacts/aios_sdk-0.2.0-py3-none-any.whl
      # The second accepted AIOS distribution: universal PostgreSQL primitives
      # (VOYN-W0-AIOS-DB-01). Pinned and verified exactly like the SDK wheel.
      AICC_AIOS_DB_WHEEL: ${{ github.workspace }}/.artifacts/aios_db-0.1.0-py3-none-any.whl
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Select impacted tests
        id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/ci/test_impact/select_tests.py \
            --base "$BASE_SHA" --format pytest --output selected-tests.txt
          if grep -qx "tests" selected-tests.txt; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
          elif [ -s selected-tests.txt ]; then
            echo "mode=subset" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi
          echo "----- selected tests -----"
          cat selected-tests.txt || true

      - name: No impacted tests
        if: steps.select.outputs.mode == 'none'
        run: echo "No first-party code affected; the full gate still runs separately."

      - name: Full suite required (deferring to quality-gates)
        if: steps.select.outputs.mode == 'all'
        run: echo "A global file changed (trigger-all); the required full gate covers this PR."

      - name: Set up Python
        if: steps.select.outputs.mode == 'subset'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci-linux.lock

      - name: Install Qt system libraries (for optional desktop shell)
        if: steps.select.outputs.mode == 'subset'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        if: steps.select.outputs.mode == 'subset'
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements-ci-linux.lock

      - name: Install exact accepted AIOS SDK and DB artifacts
        if: steps.select.outputs.mode == 'subset'
        # `bash` is not cosmetic here and is pinned by
        # `test_a_refused_guard_actually_stops_the_step`: GitHub runs it as
        # `bash --noprofile --norc -eo pipefail`, so the guard's non-zero exit
        # aborts the step. Under `pwsh` it would not — a failed native command
        # is not a terminating error there, and the fetch below would run with
        # the token anyway.
        shell: bash
        env:
          AIOS_ARTIFACT_READONLY_TOKEN: ${{ secrets.AIOS_ARTIFACT_READONLY_TOKEN }}
          AIOS_ARTIFACT_READ_TOKEN: ${{ secrets.AIOS_ARTIFACT_READ_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/assert_trusted_head_repository.py
          python scripts/fetch_aios_sdk_artifact.py --output .artifacts
          pip install "$AICC_AIOS_SDK_WHEEL"
          python scripts/fetch_aios_sdk_artifact.py --lock aios-db.lock.json --output .artifacts
          pip install "$AICC_AIOS_DB_WHEEL"

      - name: Run impacted tests (parallel)
        if: steps.select.outputs.mode == 'subset'
        run: |
          echo "Running $(wc -l < selected-tests.txt) impacted test file(s):"
          cat selected-tests.txt
          # NUL-delimit the paths and let xargs build the argv; `-r` guarantees
          # pytest is never invoked with an empty argv (which would run the
          # whole suite). `mode == subset` already implies a non-empty file.
          tr '\n' '\0' < selected-tests.txt \
            | xargs -0 -r pytest -q -m "not serial" -n auto --dist loadscope

  # Stable protected context. `always()` guarantees that the aggregator runs
  # even when an upstream job fails, is cancelled, or is skipped; only four
  # explicit success results can pass it.
  final-gate:
    name: Final merge gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - quality-gates
      - windows-quality-gates
      - security-gates
      - build-gates
    steps:
      - name: Assert required checks
        shell: bash
        run: |
          if [[ "${{ needs.quality-gates.result }}" != "success" ]]; then
            echo "quality-gates did not succeed"
            exit 1
          fi
          if [[ "${{ needs.windows-quality-gates.result }}" != "success" ]]; then
            echo "windows-quality-gates did not succeed"
            exit 1
          fi
          if [[ "${{ needs.security-gates.result }}" != "success" ]]; then
            echo "security-gates did not succeed"
            exit 1
          fi
          if [[ "${{ needs.build-gates.result }}" != "success" ]]; then
            echo "build-gates did not succeed"
            exit 1
          fi
