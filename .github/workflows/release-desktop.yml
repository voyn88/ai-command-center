name: release-desktop

# Unsigned-first distribution channel for #197: build macOS (.app, ad-hoc
# signed) and Windows (portable folder) bundles, publish them as a GitHub
# Release with SHA-256 checksums. Homebrew cask and winget manifests in
# packaging/ consume these release assets. Code signing / notarization is a
# later, owner-gated step (docs/desktop/SIGNING_RUNBOOK.md).

on:
  push:
    tags:
      - "desktop-v*"
  pull_request:
    paths:
      - ".github/workflows/release-desktop.yml"
      - "packaging/**"
      - "scripts/build-desktop-*"
      - "requirements-desktop*.txt"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: |
          python -m venv .venv-desktop
          .venv-desktop/bin/pip install --upgrade pip
          .venv-desktop/bin/pip install -r requirements-desktop-build.txt
      - name: Build .app (PyInstaller)
        run: bash scripts/build-desktop-macos.sh
      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - "dist/macos/AI Command Center.app"
          codesign --verify --verbose=2 "dist/macos/AI Command Center.app"
      - name: Archive
        run: |
          cd dist/macos
          ditto -c -k --keepParent "AI Command Center.app" "AI-Command-Center-macos-arm64.zip"
          shasum -a 256 "AI-Command-Center-macos-arm64.zip" > "AI-Command-Center-macos-arm64.zip.sha256"
          cat "AI-Command-Center-macos-arm64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/macos/AI-Command-Center-macos-arm64.zip
            dist/macos/AI-Command-Center-macos-arm64.zip.sha256
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m venv .venv-desktop
          .venv-desktop\Scripts\python.exe -m pip install --upgrade pip
          .venv-desktop\Scripts\python.exe -m pip install -r requirements-desktop-build.txt
      - name: Build portable folder (PyInstaller)
        shell: pwsh
        run: pwsh -File scripts/build-desktop-windows.ps1
      - name: Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\windows\AI Command Center" -DestinationPath "dist\windows\AI-Command-Center-windows-x64.zip"
          $hash = (Get-FileHash "dist\windows\AI-Command-Center-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  AI-Command-Center-windows-x64.zip" | Out-File -Encoding ascii "dist\windows\AI-Command-Center-windows-x64.zip.sha256"
          Get-Content "dist\windows\AI-Command-Center-windows-x64.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/windows/AI-Command-Center-windows-x64.zip
            dist/windows/AI-Command-Center-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd assets
          cat ./*.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Desktop ${GITHUB_REF_NAME}" \
            --notes "Unsigned desktop builds (#197 unsigned-first channel). Install instructions: docs/desktop/INSTALL_UNSIGNED.md. Verify SHA256SUMS.txt before running." \
            assets/AI-Command-Center-macos-arm64.zip \
            assets/AI-Command-Center-macos-arm64.zip.sha256 \
            assets/AI-Command-Center-windows-x64.zip \
            assets/AI-Command-Center-windows-x64.zip.sha256 \
            assets/SHA256SUMS.txt
