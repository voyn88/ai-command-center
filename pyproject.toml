# Project tooling configuration. This file does not change runtime behavior;
# it configures the linter (ruff), the optional static type checker (mypy),
# and coverage collection so they behave consistently when invoked locally and
# in CI. The application itself has no build/packaging metadata here.
[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
# Explicit select pinned to ruff's own built-in default (E4, E7, E9, F) so this
# is a no-op for `ruff check .` today. Making the selection explicit stops a
# 0.15->0.16 upgrade (or any future ruff release) from silently changing what
# CI enforces out from under this pin; migrating to a wider rule set is a
# separate, deliberate step (see VOYN-W0-AICC-RUFF-EXPLICIT-SELECT plan).
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# Permissive, opt-in configuration. The codebase predates type hints in several
# modules, so this is intentionally non-strict: it lets `mypy command_center/`
# report real inconsistencies without flooding a first run with hundreds of
# "missing import" / "no stub" errors. Tighten progressively per module.
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "(^build/|^\\.venv/|^__pycache__/|/tests/fixtures/)"

[tool.coverage.run]
branch = false
source = ["command_center"]
omit = ["*/__pycache__/*", "*/tests/*", "*/.venv/*"]

[tool.coverage.report]
# Show what is uncovered without ever failing the build — coverage is
# informational here, not a gate (see the non-blocking CI step).
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
# `serial` tests are timing-sensitive subprocess tests that miss their
# deadlines when pytest-xdist saturates the CPU. Both locally and in CI the
# suite runs as a parallel body plus a short serial tail:
#   pytest -q -n auto --dist loadscope -m "not serial" && pytest -q -m serial
# (see .github/workflows/ci.yml "Pytest + coverage (parallel)" / "serial tail").
markers = [
    "serial: must not run concurrently with other tests (excluded from pytest-xdist runs; see README Validation)",
    "e2e: requires the real Playwright browser and runs in the dedicated E2E partition",
]
